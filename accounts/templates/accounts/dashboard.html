<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-yellow-50 text-slate-800 min-h-screen flex flex-col justify-between antialiased">

    <!-- NAVIGATION BAR -->
    <header class="w-full bg-yellow-800 border-b border-slate-200/80 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

            <!-- Brand / Logo -->
            <a href="/accounts/" class="flex items-center gap-2 font-bold text-yellow-100 text-lg tracking-tight">
                <span>UserHub</span>
            </a>

            <!-- Nav Actions -->
            <nav class="flex items-center gap-3">
                <a href="/accounts/"
                    class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-yellow-100 hover:bg-yellow-200 text-slate-800 text-sm font-semibold transition">
                    Sign Up
                </a>
            </nav>

        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-6 md:p-12 space-y-6">

        <!-- HEADER TITLE -->
        <div class="pb-4 border-b border-slate-200/80">
            <h1 class="text-3xl font-bold text-slate-900 tracking-tight">
                Dashboard
            </h1>
            <p class="text-sm text-slate-500 mt-1">Manage registered user accounts.</p>
        </div>

        <!-- MEDIUM CARD CONTAINER -->
        <div class="bg-yellow-50 border-2 border-yellow-700 rounded-2xl shadow-sm overflow-hidden">

            <div class="p-6 border-b border-slate-200/60 flex items-center justify-between">
                <h2 class="text-base font-bold text-slate-900">Registered Accounts</h2>
                <span id="userCount"
                    class="bg-white text-yellow-900 text-xs font-bold px-3 py-1 rounded-full border border-black">
                    0 Users
                </span>
            </div>

            <!-- TABLE -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-black">
                    <thead
                        class="bg-yellow-100 text-xs uppercase tracking-wider text-slate-600 border-b border-slate-200/60">
                        <tr>
                            <th class="px-6 py-3.5 font-bold">Username</th>
                            <th class="px-6 py-3.5 font-bold">Email</th>
                            <th class="px-6 py-3.5 font-bold">Password</th>
                            <th class="px-6 py-3.5 font-bold text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y bg-yellow-50 divide-slate-200/60">
                    </tbody>
                </table>
            </div>

            <!-- EMPTY STATE -->
            <div id="emptyState" class="text-center py-12 hidden">
                <p class="text-slate-500 text-sm">No registered user data found in storage.</p>
            </div>

        </div>

    </main>

    <script>
        const tableBody = document.getElementById('userTableBody');
        const emptyState = document.getElementById('emptyState');
        const countBadge = document.getElementById('userCount');

        function renderDashboard() {
            const users = JSON.parse(localStorage.getItem('users')) || [];

            countBadge.textContent = `${users.length} User${users.length === 1 ? '' : 's'}`;
            tableBody.innerHTML = '';

            if (users.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            users.forEach((user, index) => {
                const row = document.createElement('tr');
                row.className = "hover:bg-yellow-50/50 transition-colors";

                row.innerHTML = `
                    <td class="px-6 py-4 font-semibold text-slate-900">
                        ${escapeHtml(user.username)}
                    </td>
                    <td class="px-6 py-4 text-slate-600">
                        ${escapeHtml(user.email)}
                    </td>
                    <td class="px-6 py-4">
                        <code class="text-xs bg-yellow-50 border border-slate-200 text-slate-700 px-2.5 py-1 rounded-lg block truncate max-w-[180px]">
                            ${escapeHtml(user.password)}
                        </code>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="deleteUser(${index})" class="text-red-700 hover:text-red-700 font-semibold text-xs bg-yellow-100 hover:bg-yellow-50 border border-yellow-100 px-3 py-1.5 rounded-lg transition cursor-pointer">
                            Delete
                        </button>
                    </td>
                `;

                tableBody.appendChild(row);
            });
        }

        function deleteUser(index) {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            users.splice(index, 1);
            localStorage.setItem('users', JSON.stringify(users));
            renderDashboard();
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        renderDashboard();
    </script>
</body>

</html>
