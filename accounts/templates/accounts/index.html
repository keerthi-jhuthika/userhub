<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CryptoJS for SHA-256 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>

<body class="bg-yellow-50 text-slate-800 min-h-screen flex flex-col justify-between antialiased">

    <!-- NAVIGATION BAR -->
    <header class="w-full bg-yellow-800 border-b border-slate-200/80 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

            <!-- Brand / Logo -->
            <a href="/accounts/"
                class="flex items-center gap-2 font-bold text-yellow-100 text-base sm:text-lg tracking-tight">
                <span>UserHub</span>
            </a>

            <!-- Nav Actions -->
            <nav class="flex items-center gap-2 sm:gap-3">
                <a href="/accounts/dashboard/"
                    class="inline-flex items-center gap-2 px-3 sm:px-4 py-2 rounded-xl bg-yellow-100 hover:bg-slate-200/80 text-slate-700 text-xs sm:text-sm font-semibold transition">
                    View Dashboard
                </a>
            </nav>

        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">

        <!-- MEDIUM SIGNUP CARD -->
        <div class="w-full max-w-md bg-yellow-100 border border-slate-200/80 rounded-2xl p-6 sm:p-8 shadow-sm">

            <div class="mb-6 text-center">
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Create an Account</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Sign up to access your user dashboard.</p>
            </div>

            <form id="signupForm" class="space-y-4" novalidate>

                <!-- Username -->
                <div>
                    <label
                        class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Username</label>
                    <input type="text" id="username" placeholder="johndoe"
                        class="w-full px-4 py-2.5 rounded-xl bg-yellow-25 border border-slate-200 text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/10 transition text-sm">
                    <p id="usernameError" class="text-xs text-rose-500 mt-1 hidden">Username is required.</p>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Email
                        Address</label>
                    <input type="email" id="email" placeholder="john@example.com"
                        class="w-full px-4 py-2.5 rounded-xl bg-yellow-25 border border-slate-200 text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/10 transition text-sm">
                    <p id="emailError" class="text-xs text-rose-500 mt-1 hidden">Please enter a valid email address.</p>
                </div>

                <!-- Password -->
                <div>
                    <label
                        class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Password</label>
                    <input type="password" id="password" placeholder="••••••••"
                        class="w-full px-4 py-2.5 rounded-xl bg-yellow-25 border border-slate-200 text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/10 transition text-sm">
                    <p id="passwordError" class="text-xs text-rose-500 mt-1 hidden">Password must be at least 6
                        characters.</p>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-center pt-2">
                    <button type="submit"
                        class="w-full sm:w-auto bg-yellow-700 hover:bg-indigo-700 text-white font-semibold py-2.5 px-10 rounded-xl shadow-sm transition active:scale-[0.99] cursor-pointer text-sm">
                        Sign Up
                    </button>
                </div>

            </form>

        </div>

    </main>

    <script>
        const form = document.getElementById('signupForm');
        const username = document.getElementById('username');
        const email = document.getElementById('email');
        const password = document.getElementById('password');

        const errors = {
            username: document.getElementById('usernameError'),
            email: document.getElementById('emailError'),
            password: document.getElementById('passwordError')
        };

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const usernameVal = username.value.trim();
            const emailVal = email.value.trim();
            const passwordVal = password.value;

            Object.values(errors).forEach(err => err.classList.add('hidden'));

            let isValid = true;

            if (!usernameVal) {
                errors.username.classList.remove('hidden');
                isValid = false;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailVal)) {
                errors.email.classList.remove('hidden');
                isValid = false;
            }

            if (passwordVal.length < 6) {
                errors.password.classList.remove('hidden');
                isValid = false;
            }

            if (isValid) {
                const hashedPassword = CryptoJS.SHA256(passwordVal).toString();

                const newUser = {
                    username: usernameVal,
                    email: emailVal,
                    password: hashedPassword
                };

                const users = JSON.parse(localStorage.getItem('users')) || [];
                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));

                // Redirect to Dashboard
                window.location.href = '/accounts/dashboard/';
            }
        });
    </script>
</body>

</html>
